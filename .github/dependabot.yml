version: 2
updates:
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'

  - package-ecosystem: 'npm'
    directory: '/src/beta-app'
    schedule:
      interval: 'weekly'
    groups:
      major:
        patterns:
          - '*'
        update-types:
          - 'major'
      minor:
        patterns:
          - '*'
        update-types:
          - 'minor'
      patch:
        patterns:
          - '*'
        update-types:
          - 'patch'

  - package-ecosystem: 'docker'
    directory: '/src/beta-app'
    schedule:
      interval: 'weekly'

  - package-ecosystem: 'docker-compose'
    directory: '/src/beta-app'
    schedule:
      interval: 'weekly'
