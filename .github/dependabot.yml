version: 2
updates:
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'

  - package-ecosystem: 'npm'
    directory: '/src/alpha-prototype'
    schedule:
      interval: 'weekly'      
    ignore:
      # SASS updates will be done manually in sync with
      # NHS Frontend to avoid deprecation warnings.
      - dependency-name: 'sass-embedded'

  - package-ecosystem: 'npm'
    directory: '/src/beta-app'
    schedule:
      interval: 'weekly'
    groups:
      major:
        patterns:
          - '*'
        update-types:
          - 'major'
      minor:
        patterns:
          - '*'
        update-types:
          - 'minor'
      patch:
        patterns:
          - '*'
        update-types:
          - 'patch'

  - package-ecosystem: 'docker'
    directories: '/src/**/'
    schedule:
      interval: 'weekly'

  - package-ecosystem: 'docker-compose'
    directory: '/src/beta-app'
    schedule:
      interval: 'weekly'
