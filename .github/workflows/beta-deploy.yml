name: Beta deploy
on:
  pull_request:
    paths:
      - 'src/beta-app/**'
permissions:
  contents: read
  id-token: write
  attestations: write
  packages: write
  artifact-metadata: write
jobs:
  deploy:
    runs-on: cmps-selfhosted-runner
    environment: dev
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Setup Carvel ytt
        uses: carvel-dev/setup-action@a173dc9b83a0de22af92463294fb66b904d8b2a3 # tag v2
        with:
          token: ${{ github.token }}
          only: ytt
      - name: Azure Login
        uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # tag v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SHARED_SUBSCRIPTION_ID }}
      - name: Set up environment variables
        shell: bash
        run: |
          set -euo pipefail
          ENV=dev # FIXME make this depend on the tag name
          IMAGE_PATH=compass:${{ github.sha }}
          APP_NAME="`echo ${{ github.ref_name }} | sed s_/_-_`"
          echo "ENV=${ENV}" >> "$GITHUB_ENV"
          echo "IMAGE_PATH=${IMAGE_PATH}" >> "$GITHUB_ENV"
          echo "FULL_IMAGE=${{ vars.AZURE_CONTAINER_REGISTRY}}.azurecr.io/${IMAGE_PATH}" >> "$GITHUB_ENV"
          echo "REVISION_SUFFIX=${{ github.run_number }}-${{ github.run_attempt }}" >> "$GITHUB_ENV"
          echo "APP_NAME=$APP_NAME" >> "$GITHUB_ENV"
          echo "LOCATION=${{ vars.AZURE_LOCATION }}" >> "$GITHUB_ENV"
          echo "MANAGED_IDENTITY_RESOURCE_ID=${{ vars.AZURE_MANAGED_IDENTITY_RESOURCE_ID }}" >> "$GITHUB_ENV"
          echo "MANAGED_ENVIRONMENT_ID=${{ vars.AZURE_MANAGED_ENVIRONMENT_ID }}" >> "$GITHUB_ENV"
      - name: Set up database configuration
        shell: bash
        run: |
          set -euo pipefail
          echo "DATABASE_HOST=${{ vars.AZURE_DATABASE_HOST }}" >> "$GITHUB_ENV"
          # Pick a password
          DATABASE_PASSWORD="`dd if=/dev/urandom bs=32 count=1 2>/dev/null | base64 | sed s/[^a-zA-Z0-9]//g | head -c 24`"
          echo "::add-mask::$DATABASE_PASSWORD"
          echo "DATABASE_PASSWORD=$DATABASE_PASSWORD" >> "$GITHUB_ENV"
          # Prepare database setup SQL
          cat src/beta-app/deploy/db_setup.sql | sed s/_NAME_/$APP_NAME/g | sed s/_PASSWORD_/$DATABASE_PASSWORD/g > db_setup.sql
          cat src/beta-app/deploy/db_grant.sql | sed s/_NAME_/$APP_NAME/g > db_grant.sql
      - name: Get Postgres admin token
        shell: bash
        run: |
          set -euo pipefail
          T="$(az account get-access-token --resource https://ossrdbms-aad.database.windows.net --query accessToken -o tsv)"
          echo "::add-mask::$T"
          echo "PGTOKEN=$T" >> "$GITHUB_ENV"
      - name: Create user and database
        uses: azure/postgresql@59401b7890419c83f372819a1c37f5aecf57ac92 # Tag v1.2.0
        with:
          server-name: ${{ vars.AZURE_DATABASE_HOST }}
          connection-string: "host=${{ vars.AZURE_DATABASE_HOST }} port=5432 dbname=postgres user=sp-dhscacp-ghr-cmps-dev password=${{ env.PGTOKEN }} sslmode=require"
          plsql-file: "db_setup.sql"
        continue-on-error: true # NOTICEs psql emits - such as "NOTICE:  database "18-merge" does not exist, skipping" - are interpreted as errors by the action, so we need to skip errors - see https://github.com/Azure/postgresql/issues/33
      - name: Grant access to public schema
        uses: azure/postgresql@59401b7890419c83f372819a1c37f5aecf57ac92 # Tag v1.2.0
        with:
          server-name: ${{ vars.AZURE_DATABASE_HOST }}
          connection-string: "host=${{ vars.AZURE_DATABASE_HOST }} port=5432 dbname=${{ env.APP_NAME }} user=sp-dhscacp-ghr-cmps-dev password=${{ env.PGTOKEN }} sslmode=require"
          plsql-file: "db_grant.sql"
      - name: Complete database setup
        shell: bash
        env:
          PGPASSWORD: ${{ env.DATABASE_PASSWORD }}
          PGSSLMODE: require
        run: |
          set -euo pipefail
          # Apply migrations
          export DATABASE_HOST=${{ vars.AZURE_DATABASE_HOST }}
          export DATABASE_NAME=$APP_NAME
          export DATABASE_USER=$APP_NAME
          export DATABASE_PASSWORD
          (cd src/beta-app; npm ci --ignore-scripts; npm run db:migrate)
          # Load fake data
          psql -U $DATABASE_USER -h $DATABASE_HOST -d $DATABASE_NAME < src/beta-app/database/fake-data/external.sql
          psql -U $DATABASE_USER -h $DATABASE_HOST -d $DATABASE_NAME < src/beta-app/database/fake-data/app.sql
      - name: Instantiate container YAML
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "deploy/rendered"
          ytt \
            -f "src/beta-app/deploy/template.yaml" \
            --data-value acr_login_server="${{ vars.AZURE_CONTAINER_REGISTRY }}.azurecr.io" \
            --data-value image="${FULL_IMAGE}" \
            --data-value revision_suffix="${REVISION_SUFFIX}" \
            --data-value environment="${ENV}" \
            --data-value location="${LOCATION}" \
            --data-value app_name="app-${APP_NAME}" \
            --data-value managed_identity_resource_id="${MANAGED_IDENTITY_RESOURCE_ID}" \
            --data-value managed_environment_id="/subscriptions/${{ vars.AZURE_RTL_SUBSCRIPTION_ID }}/resourceGroups/${{ vars.AZURE_RESOURCE_GROUP }}/providers/Microsoft.App/managedEnvironments/${MANAGED_ENVIRONMENT_ID}" \
            --data-value database_host="${DATABASE_HOST}" \
            --data-value database_user="${APP_NAME}" \
            --data-value database_name="${APP_NAME}" \
            --data-value database_password="${DATABASE_PASSWORD}" \
            > "deploy/rendered.yaml"
          echo "YAML=deploy/rendered.yaml" >> "$GITHUB_ENV"
      - name: Validate YAML
        shell: bash
        run: |
          set -euo pipefail
          if grep -Eq 'YOUR_|__SET_|<replace-me>' "$YAML"; then
            echo "Rendered YAML still contains placeholder values."
            exit 1
          fi
      - name: Extract bootstrap config from rendered YAML
        id: rendered_bootstrap
        shell: bash
        run: |
          set -euo pipefail
          extract_scalar() {
            local key="$1"
            awk -F': ' -v key="$key" '
              $1 ~ ("^[[:space:]]*" key "$") {
                value = $2
                sub(/^[[:space:]]+/, "", value)
                gsub(/^"|"$/, "", value)
                print value
                exit
              }
            ' "$YAML"
          }
          managed_environment_id="$(extract_scalar managedEnvironmentId)"
          workload_profile_name="$(extract_scalar workloadProfileName)"
          managed_identity_resource_id="$(sed -n '/^[[:space:]]*userAssignedIdentities:[[:space:]]*$/{
            n
            s/^[[:space:]]*//
            s/^?[[:space:]]*//
            s/:[[:space:]]*{}$//
            p
            q
          }' "$YAML")"
          if [ -z "${managed_environment_id}" ] || [ -z "${workload_profile_name}" ] || [ -z "${managed_identity_resource_id}" ]; then
            echo "Unable to extract bootstrap settings from ${YAML}"
            exit 1
          fi
          {
            echo "managed_environment_id=${managed_environment_id}"
            echo "workload_profile_name=${workload_profile_name}"
            echo "managed_identity_resource_id=${managed_identity_resource_id}"
          } >> "$GITHUB_OUTPUT"
      - name: Build image in ACR
        shell: bash
        run: |
          set -euo pipefail
          az acr build \
            --subscription "${{ vars.AZURE_RTL_SUBSCRIPTION_ID }}" \
            --registry "${{ vars.AZURE_CONTAINER_REGISTRY }}" \
            --image "${IMAGE_PATH}" \
            --file "./src/beta-app/Dockerfile" \
            ./src/beta-app
      - name: Check whether Container App exists
        id: app_exists
        shell: bash
        run: |
          set -euo pipefail
          if az containerapp show \
            --name "app-${APP_NAME}" \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --subscription "${{ vars.AZURE_RTL_SUBSCRIPTION_ID }}" > /dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Bootstrap Container App with public image
        if: ${{ steps.app_exists.outputs.exists == 'false' }}
        shell: bash
        run: |
          set -euo pipefail
          az containerapp create \
            --name "app-${APP_NAME}" \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --subscription "${{ vars.AZURE_RTL_SUBSCRIPTION_ID }}" \
            --environment "${{ steps.rendered_bootstrap.outputs.managed_environment_id }}" \
            --user-assigned "${{ steps.rendered_bootstrap.outputs.managed_identity_resource_id }}" \
            --workload-profile-name "${{ steps.rendered_bootstrap.outputs.workload_profile_name }}" \
            --image "mcr.microsoft.com/k8se/quickstart:latest" \
            --output none
      - name: Configure Container App registry auth
        shell: bash
        run: |
          set -euo pipefail
          az containerapp registry set \
            --name "app-${APP_NAME}" \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --subscription "${{ vars.AZURE_RTL_SUBSCRIPTION_ID }}" \
            --server "${{ vars.AZURE_CONTAINER_REGISTRY }}.azurecr.io" \
            --identity "${{ steps.rendered_bootstrap.outputs.managed_identity_resource_id }}" \
            --output none
      - name: Update Container App via dac-shared action
        uses: dhsc-govuk-infrastructure/dac-shared/.github/actions/containerapp-update-from-yaml@main
        with:
          app_name: app-${{ env.APP_NAME }}
          azure_resource_group: ${{ vars.AZURE_RESOURCE_GROUP }}
          container_app_yaml_path: ${{ env.YAML }}
          image_to_deploy: ${{ env.FULL_IMAGE }}
          azure_client_id: ${{ vars.AZURE_CLIENT_ID }}
          azure_tenant_id: ${{ vars.AZURE_TENANT_ID }}
          azure_subscription_id: ${{ vars.AZURE_RTL_SUBSCRIPTION_ID }}
      - name: Add/update private DNS
        shell: bash
        run: |
          read -r DOMAIN IP <<<"$(az containerapp env show -n "${MANAGED_ENVIRONMENT_ID}" -g "${{ vars.AZURE_RESOURCE_GROUP }}" --subscription "${{ vars.AZURE_RTL_SUBSCRIPTION_ID }}" --query "[properties.defaultDomain,properties.staticIp]" -o tsv | paste -s)"
          az network private-dns record-set a remove-record \
            -g "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --subscription "${{ vars.AZURE_RTL_SUBSCRIPTION_ID }}" \
            -z "$DOMAIN" \
            -n "app-${APP_NAME}" \
            -a "$IP" \
            --output none || true
          az network private-dns record-set a add-record \
            -g "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --subscription "${{ vars.AZURE_RTL_SUBSCRIPTION_ID }}" \
            -z "$DOMAIN" \
            -n "app-${APP_NAME}" \
            -a "$IP" \
            --output none
          echo "APP_URL=https://app-${APP_NAME}.${DOMAIN}" >> "$GITHUB_ENV"
      - name: Add deployment summary
        shell: bash
        run: |
          {
            echo "### ${APP_NAME} deployment"
            echo
            echo "- image: ${FULL_IMAGE}"
            echo "- url: ${APP_URL}"
          } >> "$GITHUB_STEP_SUMMARY"
