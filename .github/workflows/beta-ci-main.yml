name: Beta CI on main
# This does the same as CI for PRs at the moment, but can be used for deployments in the future

on:
  push:
    branches:
      - main
    paths:
      - 'src/beta-app/**'

jobs:
  tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/beta-app
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: src/beta-app/.nvmrc
          cache: 'npm'
          cache-dependency-path: src/beta-app/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Build project
        run: npm run build
      - name: Run linting
        run: npm run lint
      - name: Run format check
        run: npm run format:check
      - name: Seed some test data
        run: sqlite3 database.db < ../alpha-prototype/schema.sql
      - name: Run tests with coverage
        run: npm run test:coverage
      - name: Setup Chrome
        id: chrome
        uses: browser-actions/setup-chrome@v1
      - name: Generate sitemap for Pa11y tests
        run: npm run generate:sitemap
      - name: Run Pa11y accessibility tests
        env:
          PUPPETEER_EXECUTABLE_PATH: ${{ steps.chrome.outputs.chrome-path }}
        run: npm run test:a11y
