name: Beta CI on main
# This does the same as CI for PRs at the moment, but can be used for deployments in the future

on:
  push:
    branches:
      - main
    paths:
      - 'src/beta-app/**'

jobs:
  tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/beta-app
    permissions:
      contents: read
      code-quality: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: src/beta-app/.nvmrc
          cache: 'npm'
          cache-dependency-path: src/beta-app/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Build project
        run: npm run build
      - name: Run linting
        run: npm run lint
      - name: Run format check
        run: npm run format:check
      - name: Run tests with coverage
        run: npm run test:coverage
      - name: Upload coverage report
        uses: actions/upload-code-coverage@v1
        with:
          file: src/beta-app/coverage/cobertura-coverage.xml
          language: TypeScript
          label: code-coverage/typescript
