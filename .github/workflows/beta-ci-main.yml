name: Beta CI on main
# This does the same as CI for PRs at the moment, but can be used for deployments in the future

on:
  push:
    branches:
      - main
    paths:
      - 'src/beta-app/**'

jobs:
  tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/beta-app
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: src/beta-app/.nvmrc
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Build project
        run: npm run build
      - name: Run linting
        run: npm run lint
      - name: Run format check
        run: npm run format:check
      # - name: Run tests
      #   run: npm run test:ci
