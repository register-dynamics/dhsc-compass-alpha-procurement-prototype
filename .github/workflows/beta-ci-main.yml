name: Beta CI on main
# This does the same as CI for PRs at the moment, but can be used for deployments in the future

on:
  push:
    branches:
      - main
    paths:
      - 'src/beta-app/**'

jobs:
  tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/beta-app
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: src/beta-app/.nvmrc
          cache: 'npm'
          cache-dependency-path: src/beta-app/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Build project
        run: npm run build
      - name: Run linting
        run: npm run lint
      - name: Run format check
        run: npm run format:check
      - name: Run all the tests, with coverage
        run: ../../test-beta.sh --really-zap-my-database --coverage --accessability --e2e
      - name: Report coverage
        uses: davelosert/vitest-coverage-report-action@v2
        with:
          json-summary-path: src/beta-app/coverage/coverage-summary.json
          json-final-path: src/beta-app/coverage/coverage-final.json
          name: Beta app coverage
          vite-config-path: src/beta-app/vitest.config.ts
