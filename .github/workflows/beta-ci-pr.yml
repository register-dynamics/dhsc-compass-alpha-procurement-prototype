name: Beta CI on pull requests

on:
  pull_request:
    paths:
      - 'src/beta-app/**'

jobs:
  tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/beta-app
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: src/beta-app/.nvmrc
          cache: 'npm'
          cache-dependency-path: src/beta-app/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Build project
        run: npm run build
      - name: Run linting
        run: npm run lint
      - name: Run format check
        run: npm run format:check
      - name: Seed some test data
        run: sqlite3 database.db < ../alpha-prototype/schema.sql
      - name: Run tests with coverage
        run: npm run test:coverage
      - name: Report coverage
        uses: davelosert/vitest-coverage-report-action@v2
        with:
          json-summary-path: src/beta-app/coverage/coverage-summary.json
          json-final-path: src/beta-app/coverage/coverage-final.json
          name: Beta app coverage
          vite-config-path: src/beta-app/vitest.config.ts


