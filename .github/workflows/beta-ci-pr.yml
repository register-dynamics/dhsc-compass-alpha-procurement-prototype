name: Beta CI on pull requests

on:
  pull_request:
    paths:
      - 'src/beta-app/**'

jobs:
  tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/beta-app
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: src/beta-app/.nvmrc
          cache: 'npm'
          cache-dependency-path: src/beta-app/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Build project
        run: npm run build
      - name: Run linting
        run: npm run lint
      - name: Run format check
        run: npm run format:check
      - name: Seed some test data
        run: sqlite3 database.db < ../alpha-prototype/schema.sql
      - name: Run tests with coverage
        run: npm run test:coverage
      - name: Report coverage
        uses: davelosert/vitest-coverage-report-action@v2
        with:
          json-summary-path: src/beta-app/coverage/coverage-summary.json
          json-final-path: src/beta-app/coverage/coverage-final.json
          name: Beta app coverage
          vite-config-path: src/beta-app/vitest.config.ts
      - name: Setup Chrome
        id: chrome
        uses: browser-actions/setup-chrome@v1
      - name: Generate sitemap for Pa11y tests
        run: npm run generate:sitemap
      - name: Run Pa11y accessibility tests
        env:
          PUPPETEER_EXECUTABLE_PATH: ${{ steps.chrome.outputs.chrome-path }}
        run: npm run test:a11y
      - name: Parse Pa11y accessibility report
        run: node scripts/parse-pa11y-report.mjs > comment.md
      - uses: mshick/add-pr-comment@v3
        with:
          message-path: src/beta-app/comment.md



