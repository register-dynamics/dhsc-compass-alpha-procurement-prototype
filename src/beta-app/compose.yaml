name: compass-beta

services:
  db:
    image: postgres:18.6
    restart: always
    environment:
      POSTGRES_USER: compass
      POSTGRES_DB: compass
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres-passwd
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql
    secrets:
      - postgres-passwd
    networks:
      - default
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U compass -d compass"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3001:3001"
    secrets:
      - postgres-passwd
    environment:
      DATABASE_NAME: compass
      DATABASE_USER: compass
      DATABASE_HOST: db
      DATABASE_PASSWORD_FILE: /run/secrets/postgres-passwd
    develop:
      watch:
        - action: sync
          path: .
          target: /compass
          initial_sync: true
          ignore:
            - node_modules
            - dist
            - coverage
        - action: rebuild
          path: package-lock.json
    networks:
      - default
    depends_on:
      db:
        condition: service_healthy

volumes:
  db-data:

secrets:
  postgres-passwd:
    file: ./postgres-passwd

networks:
  default:
    driver: bridge
